[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "renode-resilience"
version = "1.0.0"
description = "Find firmware bugs before they find you in the field."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "RenodeResilience Team"}]
dependencies = [
    "PyQt6>=6.6",
    "PyQtGraph>=0.13",
    "pandas>=2.0",
    "numpy>=1.24",
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "WeasyPrint>=60",
    "scikit-learn>=1.3",
    "fastapi>=0.100",
    "uvicorn>=0.29",
    "typer>=0.9",
    "websockets",
    "psutil",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "pytest-qt", "ruff", "mypy", "robotframework"]

[project.scripts]
renode-resilience = "src.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["src"]
