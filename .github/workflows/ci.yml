name: CI
on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff · black · mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install lint deps
        run: |
          python -m pip install --upgrade pip
          pip install ruff black mypy types-PyYAML types-Jinja2
          pip install -r requirements.txt
      - name: ruff check
        run: ruff check src/ --output-format=github || true
      - name: ruff format (check)
        run: ruff format --check src/ || true
      - name: black (check)
        run: black --check src/ --line-length 100 || true
      - name: mypy (core)
        run: mypy src/core src/config --ignore-missing-imports --no-error-summary || true
        # mypy/ruff/black are advisory on CI until strict typing is complete; change to hard fail when clean.

  test:
    name: Test py${{ matrix.python-version }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
        exclude:
          # reduce cost: only ubuntu tests both py versions; win/mac only 3.11
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            pyproject.toml
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Unit tests with coverage
        run: |
          mkdir -p results
          pytest tests/unit -v --junitxml=results/junit-unit.xml --cov=src --cov-report=term --cov-report=xml:results/coverage.xml --cov-report=html:htmlcov --cov-fail-under=60
        # cov 70 is CI gate; local target 90 (--cov-report=term shows missing)
      - name: Upload coverage to artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            results/coverage.xml
            results/junit-unit.xml
            htmlcov/
          if-no-files-found: warn
      - name: Upload to Codecov (ubuntu only)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: results/coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  validate:
    name: Campaign validator
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt -q
      - name: Validate all campaigns
        run: |
          set -e
          for f in campaigns/*.yaml; do
            echo "Validating $f"
            python -m src.config.validator "$f"
          done
      - name: List faults & platforms (CLI smoke)
        run: |
          python -m src.cli faults
          python -m src.cli platforms

  cli-smoke:
    name: CLI smoke (campaign → report → compare)
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt -q
      - name: Run sensor suite (sim, parallel 2)
        run: |
          python -m src.cli campaign --config campaigns/sensor_suite.yaml --parallel 2 --output results
          ls -lh results/
          cat results/Sensor_Suite_Validation.json
      - name: Renode fallback smoke (--renode with missing binary → sim fallback)
        run: |
          python -m src.cli campaign --config campaigns/sensor_suite.yaml --renode --renode-bin nonexistent_renode_xyz --output results
          echo "fallback OK"
      - name: Generate reports (html/pdf/json/junit)
        run: |
          python -m src.cli report --results results/Sensor_Suite_Validation.json --format html --output results/report.html
          python -m src.cli report --results results/Sensor_Suite_Validation.json --format json --output results/report.json
          python -m src.cli report --results results/Sensor_Suite_Validation.json --format junit --output results/junit.xml
          ls -lh results/report.*
      - name: Compare (self-compare)
        run: |
          python -m src.cli compare --baseline results/Sensor_Suite_Validation.json --optimized results/Sensor_Suite_Validation.json --output results/comparison.html
          cat results/comparison.html
      - uses: actions/upload-artifact@v4
        with:
          name: cli-smoke-results
          path: results/

  api-smoke:
    name: API smoke
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt -q
      - name: Start API and hit endpoints
        run: |
          uvicorn src.api.app:app --host 127.0.0.1 --port 8000 &
          PID=$!
          sleep 3
          curl -fsS http://127.0.0.1:8000/api/v1/faults | head -c 500
          curl -fsS http://127.0.0.1:8000/api/v1/platforms
          curl -fsS -X POST http://127.0.0.1:8000/api/v1/run -H "Content-Type: application/json" -d '{"firmware":"a.elf","platform":"stm32f4","fault":"SF-01"}' | head -c 500
          kill $PID || true

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: renode-resilience:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke — import inside container
        run: |
          docker run --rm renode-resilience:ci python -c "import src.core.campaign; print('docker import OK')"
          docker run --rm renode-resilience:ci python -m src.config.validator campaigns/sensor_suite.yaml

  renode-integration:
    name: Renode integration (Robot)
    runs-on: ubuntu-latest
    needs: test
    # Do not block CI if Renode infra flakes; keep as advisory.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt -q
      - uses: antmicro/renode-test-action@v5
        with:
          renode-revision: 'master'
          tests-to-run: 'tests/integration/**/*.robot'
          artifacts-path: 'results/renode'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renode-results
          path: results/renode
