name: "Motor Controller Safety"
firmware: "examples/motor-controller/build/motor.elf"
platform: "resources/platforms/stm32f4_discovery.repl"
duration: 60
parallel: 2
faults:
  - id: TF-01
    params: { delay_ms: 100, target: "control_loop" }
    expected: "watchdog_reset"
    timeout_ms: 200
  - id: GF-01
    params: { pin: "PA5", mode: "float" }
    expected: "pin_safe_state"
    timeout_ms: 1000
scoring:
  weights: { detection: 0.3, recovery: 0.2, safety: 0.5 }
  thresholds: { grade_a: 90, grade_b: 70, grade_c: 50, grade_d: 30 }
